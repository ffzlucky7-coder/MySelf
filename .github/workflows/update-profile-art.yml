name: Update Profile Art

on:
  schedule:
    - cron: "17 6 * * *" # Daily ~06:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch Latest Contributions
        run: python scripts/fetch_contributions.py ffzlucky7-coder

      - name: Render Heatmap SVG
        run: python scripts/render_heatmap_svg.py data/contributions.json

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
