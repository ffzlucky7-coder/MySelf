<line x1="0" y1="36" x2="860" y2="36" stroke="#30363d" stroke-width="1" />
<g class="pill-rect" style="animation-delay: 0.1s;">
<rect x="28" y="56" width="257" height="36" fill="url(#grad1)" rx="18" ry="18" />
